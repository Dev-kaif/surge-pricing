[project]
name = "surge-pricing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Kaif", email = "mohammadkaifpro@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
surge-pricing = "surge_pricing:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
